<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Chat</title>

  <!-- PWA: manifest dinámico por room_id, para que "Instalar app" arme un
       ícono que abre directo a la lista de chats (ver api/manifest.js) -->
  <script>
    (function () {
      var roomId = location.pathname.split("/").filter(Boolean)[1] || "";
      document.write('<link rel="manifest" href="/api/manifest?room=' + encodeURIComponent(roomId) + '">');
    })();
  </script>
  <meta name="theme-color" content="#0b0f14" />

  <!-- iOS: Safari no respeta bien el manifest, hay que declarar esto aparte -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="/device/style.css" />
</head>
<body>
  <div id="list-root">
    <header id="list-header">
      <h1>Chats</h1>
    </header>

    <ul id="chat-list"></ul>
  </div>

  <script src="/device/app.js" type="module"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
