<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Chat</title>

  <!-- PWA: manifest dinámico por room_id, para que "Instalar app" arme un
       ícono que abre directo a la lista de chats (ver api/manifest.js) -->
  <script>
    (function () {
      var roomId = location.pathname.split("/").filter(Boolean)[1] || "";
      document.write('<link rel="manifest" href="/api/manifest?room=' + encodeURIComponent(roomId) + '">');
    })();
  </script>
  <meta name="theme-color" content="#0b0f14" />

  <!-- iOS: Safari no respeta bien el manifest, hay que declarar esto aparte -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chat" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="/device/chat/style.css" />
</head>
<body>
  <div id="chat-root">
    <!-- Banner de notificación simulada: de otra conversación distinta a
         esta (si es la misma que ya estás mirando, no tiene sentido) -->
    <div id="notification-banner">
      <span id="notification-avatar"></span>
      <span class="notification-body">
        <span id="notification-name"></span>
        <span id="notification-text"></span>
      </span>
    </div>

    <!-- Header simulando contacto -->
    <header id="chat-header">
      <a id="back-link" href="#" aria-label="Volver">‹</a>
      <span id="contact-avatar"></span>
      <span id="contact-info">
        <span id="contact-name">Contacto</span>
        <span id="contact-status">en línea</span>
      </span>
    </header>

    <!-- Área de mensajes -->
    <main id="messages">
      <!-- Placeholder mientras carga la primera vez (sin caché todavía) -->
      <div class="skeleton-bubble incoming" aria-hidden="true"></div>
      <div class="skeleton-bubble outgoing" aria-hidden="true"></div>
      <div class="skeleton-bubble incoming short" aria-hidden="true"></div>
    </main>

    <!-- Visor fullscreen: click en una foto del chat la abre acá -->
    <div id="image-viewer" class="hidden">
      <img id="image-viewer-img" alt="Foto" />
    </div>

    <!-- Overlay de llamada entrante -->
    <div id="incoming-call-overlay" class="hidden">
      <div class="call-ringing">
        <span id="call-avatar"></span>
        <span id="caller-name">Contacto</span>
        <span id="call-kind" class="call-kind">Llamada de audio</span>
        <div class="call-actions">
          <button id="call-decline-btn" type="button" aria-label="Rechazar">✕</button>
          <button id="call-accept-btn" type="button" aria-label="Contestar">📞</button>
        </div>
      </div>
      <!-- Solo para videollamada: pantalla verde chroma con marcadores de
           tracking estáticos, para compositar el video real en post -->
      <div class="call-connected hidden">
        <div class="call-tracker-screen">
          <span class="call-tracker-mark tl"></span>
          <span class="call-tracker-mark tr"></span>
          <span class="call-tracker-mark bl"></span>
          <span class="call-tracker-mark br"></span>
          <span class="call-tracker-mark c"></span>
        </div>
        <button id="call-hangup-btn" type="button" aria-label="Colgar">📞</button>
      </div>
    </div>

    <!-- Pantalla de "mantener presionado el botón de encendido" (apagar /
         Ficha médica / SOS) — solo visual, ningún slider dispara nada real -->
    <div id="emergency-overlay" class="hidden">
      <div class="emergency-slider power" data-slider>
        <span class="slider-thumb">⏻</span>
        <span class="slider-label">deslizar para apagar</span>
      </div>
      <div class="emergency-slider medical" data-slider>
        <span class="slider-thumb">✱</span>
        <span class="slider-label">Ficha médica</span>
      </div>
      <div class="emergency-slider sos" data-slider>
        <span class="slider-thumb">SOS</span>
        <span class="slider-label">Emergencia SOS</span>
      </div>
    </div>

    <!-- Pantalla alternativa a la de arriba: la llamada SOS ya en curso
         (resultado de completar el slider "Emergencia SOS") — mismo
         criterio, solo visual y solo el director la cierra. El fondo
         desenfocado reusa la foto de la pantalla de inicio si hay una -->
    <div id="sos-call-overlay" class="hidden">
      <div class="sos-call-bg"></div>
      <div class="sos-call-scrim"></div>
      <div class="sos-call-header">
        <span class="sos-call-number">112</span>
        <span class="sos-call-status">Llamada SOS: llamando…</span>
      </div>
      <div class="sos-call-grid">
        <div class="sos-call-btn">
          <span class="sos-call-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg></span>
          <span class="sos-call-label">silenciar</span>
        </div>
        <div class="sos-call-btn">
          <span class="sos-call-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></span>
          <span class="sos-call-label">teclado</span>
        </div>
        <div class="sos-call-btn">
          <span class="sos-call-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.3 9a5 5 0 0 1 0 6"/><path d="M19 6.5a9 9 0 0 1 0 11"/></svg></span>
          <span class="sos-call-label">altavoz</span>
        </div>
        <div class="sos-call-btn disabled">
          <span class="sos-call-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="sos-call-label">añadir llamada</span>
        </div>
        <div class="sos-call-btn disabled">
          <span class="sos-call-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>
            <span class="sos-call-badge">?</span>
          </span>
          <span class="sos-call-label">FaceTime</span>
        </div>
        <div class="sos-call-btn">
          <span class="sos-call-icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.5" r="3.2"/><path d="M5.5 19c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="sos-call-label">contactos</span>
        </div>
      </div>
      <button type="button" class="sos-call-hangup" aria-label="Colgar">📞</button>
      <div class="sos-call-indicator"></div>
    </div>

    <!-- Pantalla de alarma simulada — a diferencia de la de arriba, el
         actor SÍ la puede cerrar tocando "Detener"/"Posponer" (las dos
         hacen lo mismo: cerrar, sin lógica de snooze real) -->
    <div id="alarm-overlay" class="hidden">
      <div class="alarm-info">
        <span class="alarm-kind">⏰ Alarma</span>
        <span id="alarm-time"></span>
      </div>
      <div class="alarm-actions">
        <button id="alarm-snooze-btn" type="button">Posponer</button>
        <button id="alarm-stop-btn" type="button">Detener</button>
      </div>
    </div>

    <!-- Pantalla de inicio simulada — fondo/hora/fecha los define el
         director; el actor la cierra con un swipe real hacia arriba
         (src/shared/homeScreenOverlay.js), como desbloquear un iPhone -->
    <div id="home-screen-overlay" class="hidden">
      <div class="home-screen-drag-layer">
        <div class="home-screen-bg"></div>
        <div class="home-screen-vignette"></div>
        <div class="home-screen-content">
          <span id="home-screen-date"></span>
          <span id="home-screen-time"></span>
        </div>
        <div class="home-screen-bottom">
          <span class="home-screen-icon-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
              <path d="M8.5 2.5h7l-1 5.5h-5l-1-5.5Z" fill="#fff" />
              <rect x="8.7" y="8" width="6.6" height="11" rx="1.6" fill="#fff" />
              <path d="M9.2 19.5h5.6l-.9 2h-3.8l-.9-2Z" fill="#fff" />
            </svg>
          </span>
          <span class="home-screen-icon-btn" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="3.4" width="6" height="2.2" rx="1" fill="#fff" />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M3 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9Zm9 9.2a5.2 5.2 0 1 0 0-10.4 5.2 5.2 0 0 0 0 10.4Z"
                fill="#fff"
              />
            </svg>
          </span>
        </div>
        <div class="home-screen-indicator"></div>
      </div>
    </div>

    <!-- Composer: el actor escribe y envía sus propios mensajes -->
    <footer id="device-composer">
      <label id="device-attach-btn" for="device-image-input" aria-label="Adjuntar foto">📎</label>
      <input id="device-image-input" type="file" accept="image/*" hidden />
      <input id="device-message-input" type="text" placeholder="Mensaje" autocomplete="off" />
      <button id="device-send-btn" type="button" aria-label="Enviar">➤</button>
    </footer>
  </div>

  <script src="/device/chat/app.js" type="module"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
