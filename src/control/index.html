<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Control — Chat Rodaje</title>
  <link rel="stylesheet" href="/control/style.css" />
</head>
<body>
  <div id="control-root">
    <aside id="device-list">
      <h2>Dispositivos</h2>
      <ul id="devices"></ul>

      <button id="new-device-btn" type="button">+ Nuevo dispositivo</button>
      <form id="new-device-form" class="hidden">
        <input id="new-room-id" placeholder="código (ej: actor1)" autocomplete="off" />
        <div class="form-actions">
          <button type="submit">Crear</button>
          <button type="button" id="cancel-new-device-btn">Cancelar</button>
        </div>
      </form>
    </aside>

    <main id="control-panel">
      <h2 id="active-room-label">Selecciona un dispositivo</h2>

      <div id="room-settings" class="hidden">
        <label>Nombre interno (vos)<input id="edit-room-label" placeholder="Actor 1 - Ana" /></label>
        <label>Nombre del contacto (lo ve el actor)<input id="edit-contact-name" placeholder="Mamá" /></label>
        <label>Estado<input id="edit-contact-status" placeholder="en línea" /></label>
        <button id="save-room-settings-btn" type="button">Guardar</button>
      </div>

      <div id="room-messages"></div>

      <div id="composer">
        <button id="direction-btn" type="button"></button>
        <input id="message-input" type="text" placeholder="Escribir mensaje..." />
        <button id="send-btn">Enviar</button>
      </div>

      <div id="quick-actions">
        <button id="typing-btn">Simular "escribiendo..."</button>
        <button id="seen-btn">Marcar como visto</button>
        <button id="call-btn">Simular llamada entrante</button>
      </div>
    </main>
  </div>

  <script src="/control/app.js" type="module"></script>
</body>
</html>
